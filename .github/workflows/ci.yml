# CI：lint + 单元测试 + 覆盖率（NFR-5：CI 全绿方可合并）
# 覆盖率 70% 门槛已启用（TC-22；核心模块 model/context/storage 于 Sprint 1 落地）
name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint+test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e ".[dev,server]"

      - name: Lint（ruff）
        run: ruff check .

      - name: 测试 + 覆盖率（门槛 70%，NFR-5/TC-22）
        run: pytest --cov=agenttrace --cov=server --cov-fail-under=70 --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml

  viewer:
    name: Viewer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建并验证完整安装包
        working-directory: .
        run: |
          python scripts/build_wheel.py
          python scripts/verify_wheel.py dist/agenttrace-0.1.0-py3-none-any.whl
          python scripts/verify_install.py dist/agenttrace-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-static
          path: server/static
      - uses: actions/upload-artifact@v4
        with:
          name: agenttrace-wheel
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: install-acceptance
          path: docs/install-acceptance.json
